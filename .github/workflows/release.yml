
name: Release and Deployment Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, Test and Publish
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: world
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Import world database
        run: mysql -h 127.0.0.1 -uroot -proot world < db/world.sql

      - name: Build and run tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
        run: mvn -B clean verify

      - name: Smoke test Docker Compose
        run: |
          docker compose up --build --abort-on-container-exit \
            --exit-code-from app > compose-output.log 2>&1 || {
              cat compose-output.log
              exit 1
            }
          cat compose-output.log
          grep -q "Database connection closed." compose-output.log

      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            target/set08103-team7-pipeline-1.0-SNAPSHOT.jar \
            --generate-notes

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/moxxit/set08103-team7-pipeline:${{ github.ref_name }}
