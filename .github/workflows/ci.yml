name: Java CI Pipeline

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: examplepassword
          MYSQL_DATABASE: world
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -p=examplepassword" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Import World Database
        run: |
          mysql -h 127.0.0.1 -uroot -pexamplepassword world < db/world.sql

      - name: Build with Maven
        run: mvn clean package