version: '3.8'
services:
  db:
    build: db/.
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'true'
    ports:
      - "33060:3306"
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-u", "root", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  app:
    build: .
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=
    depends_on:
      db:
        condition: service_healthy